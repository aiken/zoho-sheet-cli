[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoho-sheet-cli"
version = "0.1.0"
description = "A powerful CLI tool for Zoho Sheet API v2"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aiken", email = "your.email@example.com"}
]
keywords = ["zoho", "sheet", "cli", "api", "spreadsheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "responses>=0.23.0",
]

[project.scripts]
zsheet = "zoho_sheet_cli.cli:main"

[project.urls]
Homepage = "https://github.com/aiken/zoho-sheet-cli"
Repository = "https://github.com/aiken/zoho-sheet-cli"
Documentation = "https://github.com/aiken/zoho-sheet-cli#readme"
Issues = "https://github.com/aiken/zoho-sheet-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["zoho_sheet_cli*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
