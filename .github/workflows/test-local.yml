name: Local Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Test CLI help
      run: |
        zsheet --help
        zsheet --version
    
    - name: Test auth commands (without credentials)
      run: |
        zsheet auth --help
        zsheet auth status || true  # Expected to fail without credentials
    
    - name: Test workbook commands (help only)
      run: |
        zsheet workbook --help
        zsheet workbook list --help
        zsheet workbook create --help
    
    - name: Test worksheet commands (help only)
      run: |
        zsheet worksheet --help
        zsheet worksheet list --help
    
    - name: Test cell commands (help only)
      run: |
        zsheet cell --help
        zsheet cell get --help
        zsheet cell set --help
    
    - name: Test file commands (help only)
      run: |
        zsheet file --help
        zsheet file export --help
        zsheet file import --help
    
    - name: Run pytest
      run: pytest -v
